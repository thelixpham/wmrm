[project]
name = "wmrm"
version = "0.1.0"
description = "Internal tool: remove a fixed-position watermark from video"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "torch>=2.2",
    "simple-lama-inpainting>=0.1.2",
]

[project.scripts]
wmrm = "wmrm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmrm"]
